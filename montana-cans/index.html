<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Montana Cans CZ · Graffiti barvy, fixy a trysky · Praha</title>
  <meta name="description" content="Oficiální český e-shop Montana Cans. Spreje BLACK, GOLD, BLUE, akrylové fixy, trysky, oblečení a doplňky. Osobní odběr v Praze, doprava zdarma nad 3 000 Kč.">
  <meta name="theme-color" content="#141210">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Přeskočit na obsah</a>

  <!-- Floating pill navigation -->
  <header class="pill" id="pill">
    <div class="pill-bar">
      <a href="#/" class="pill-logo" aria-label="Montana Cans – domů">
        <img src="assets/img/logo.svg" alt="Montana Cans" width="120" height="25">
      </a>
      <div class="pill-actions">
        <button class="pill-btn dark" id="menuBtn" aria-expanded="false" aria-controls="pillMenu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
        </button>
        <span class="pill-sep" aria-hidden="true"></span>
        <button class="pill-btn light" id="cartBtn" aria-label="Košík">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
    <nav class="pill-menu" id="pillMenu" aria-label="Hlavní menu">
      <a href="#/shop" class="tile wide">Shop <span class="chev">›</span></a>
      <a href="#/shop/spreje" class="tile"><span class="ico">◉</span>Spreje</a>
      <a href="#/shop/fixy" class="tile"><span class="ico">✎</span>Fixy</a>
      <a href="#/shop/trysky" class="tile"><span class="ico">◎</span>Trysky</a>
      <a href="#/shop/obleceni" class="tile"><span class="ico">◇</span>Oblečení</a>
      <a href="#/o-nas" class="tile"><span class="ico">i</span>O nás</a>
      <a href="#/kontakt" class="tile"><span class="ico">✉</span>Kontakt</a>
      <div class="pill-menu-foot"><span>© 2026 Montana Cans CZ</span><a href="https://www.instagram.com/montanacans.cz/" target="_blank" rel="noopener">@montanacans.cz</a></div>
    </nav>
  </header>

  <main id="main" class="frame" tabindex="-1"></main>

  <!-- Cart drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Košík" aria-hidden="true">
    <div class="drawer-head">
      <h2>Košík</h2>
      <button class="round" id="drawerClose" aria-label="Zavřít">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
